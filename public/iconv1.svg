<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Background Shield (Optional: remove rect for transparent bg) -->
  <rect width="64" height="64" rx="16" fill="#0F172A"/>
  
  <!-- Interlocking Swap Arrows forming 'S' -->
  <path d="M 42 18 C 30 18, 20 22, 20 30 C 20 38, 44 32, 44 42 C 44 48, 32 50, 20 48" 
        fill="none" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Arrow Head Top -->
  <path d="M 36 12 L 44 18 L 36 24" fill="none" stroke="#6366F1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow Head Bottom -->
  <path d="M 26 54 L 18 48 L 26 42" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Plus (+) Accent -->
